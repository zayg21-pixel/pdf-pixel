name: Publish NuGet Packages

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Pack
        run: |
          $projects = @(
            'PdfPixel.PostScript',
            'PdfPixel.Ccitt',
            'PdfPixel.Jbig2',
            'PdfPixel.Jpg',
            'PdfPixel.Jpx',
            'PdfPixel.Color',
            'PdfPixel.Fonts',
            'PdfPixel'
          )
          foreach ($project in $projects) {
            dotnet pack "$project/$project.csproj" --configuration Release --output "${{ github.workspace }}/nupkg"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: NuGet login (OIDC to temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: |
          foreach ($package in Get-ChildItem -Path "${{ github.workspace }}/nupkg" -Filter *.nupkg) {
            dotnet nuget push $package.FullName --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
