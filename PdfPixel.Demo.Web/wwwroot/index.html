<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Pixel</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <header id="header">
        <h1 class="app-title">PDF <span class="title-accent">Pixel</span></h1>
        <div class="header-sep"></div>

        <input type="file" id="pdfFileInput" accept="application/pdf" style="display:none">
        <button id="loadPdfBtn" title="Open a PDF file">
            <span class="material-symbols-outlined">upload_file</span>
            Open PDF
        </button>

        <div class="header-sep"></div>

        <div class="page-nav">
            <button id="prevPage" class="hdr-icon-btn" disabled title="Previous page">
                <span class="material-symbols-outlined">chevron_left</span>
            </button>
            <input id="pageInput" type="number" value="" placeholder="–" disabled min="1" title="Go to page" aria-label="Current page">
            <span id="pageTotal" class="page-total">/ –</span>
            <button id="nextPage" class="hdr-icon-btn" disabled title="Next page">
                <span class="material-symbols-outlined">chevron_right</span>
            </button>
        </div>

        <div class="header-sep"></div>

        <button id="zoomOut" class="hdr-icon-btn" title="Zoom out (Ctrl+scroll)">
            <span class="material-symbols-outlined">zoom_out</span>
        </button>
        <span id="zoomLevel">100%</span>
        <button id="zoomIn" class="hdr-icon-btn" title="Zoom in (Ctrl+scroll)">
            <span class="material-symbols-outlined">zoom_in</span>
        </button>
        <button id="resetZoom" class="hdr-icon-btn" title="Reset zoom">
            <span class="material-symbols-outlined">zoom_in_map</span>
        </button>
        <button id="autoScale" class="hdr-icon-btn" title="Change pages fit mode">
            <span id="autoScaleIcon" class="material-symbols-outlined">height</span>
        </button>

        <div class="header-sep"></div>

        <button id="rotateAllPages" class="hdr-icon-btn" title="Rotate all pages">
            <span class="material-symbols-outlined">rotate_right</span>
        </button>
        <button id="rotatePage" class="hdr-icon-btn" title="Rotate current page">
            <span class="material-symbols-outlined">rotate_right</span>
            <span class="rotate-page-index">1</span>
        </button>

        <div class="hdr-spacer"></div>

        <button id="searchToggle" class="hdr-icon-btn" disabled title="Search (Ctrl+F)">
            <span class="material-symbols-outlined">search</span>
        </button>

        <a id="githubBtn" class="hdr-icon-btn" href="https://github.com/zayg21-pixel/pdf-pixel" target="_blank" rel="noopener" title="View on GitHub">
            <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
                    0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
                    -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
                    .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
                    -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0
                    1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82
                    1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01
                    1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z" />
            </svg>
        </a>
    </header>

    <div id="main">
        <nav id="sideRail" hidden>
            <button class="hdr-icon-btn" data-side-panel="thumbnails" title="Thumbnails">
                <span class="material-symbols-outlined">view_agenda</span>
            </button>
            <button class="hdr-icon-btn" data-side-panel="outlines" title="Contents">
                <span class="material-symbols-outlined">toc</span>
            </button>
            <button class="hdr-icon-btn" data-side-panel="layers" title="Layers">
                <span class="material-symbols-outlined">layers</span>
            </button>
            <button class="hdr-icon-btn" data-side-panel="attachments" title="Attachments">
                <span class="material-symbols-outlined">attach_file</span>
            </button>
        </nav>

        <aside id="sidePanel" hidden>
            <section class="side-section" data-side-panel="thumbnails">
                <div class="side-header">Thumbnails</div>
                <div id="thumbnailList" class="side-content"></div>
            </section>
            <section class="side-section" data-side-panel="outlines">
                <div class="side-header">Contents</div>
                <div id="outlineTree" class="side-content"></div>
            </section>
            <section class="side-section" data-side-panel="layers">
                <div class="side-header">Layers</div>
                <select id="layerConfigurationSelect" aria-label="Layer configuration"></select>
                <div id="layerTree" class="side-content"></div>
            </section>
            <section class="side-section" data-side-panel="attachments">
                <div class="side-header">Attachments</div>
                <div id="attachmentList" class="side-content"></div>
            </section>
        </aside>

        <div id="sideSplitter" hidden></div>

        <div id="canvasContainer">
            <div id="pointerPopup" class="annotation-popup"></div>
        </div>
    </div>

    <footer id="footer" hidden>
        <input id="searchInput" type="search" placeholder="Search" aria-label="Search">
        <button id="previousSearchResult" class="hdr-icon-btn" title="Previous result">
            <span class="material-symbols-outlined">keyboard_arrow_up</span>
        </button>
        <button id="nextSearchResult" class="hdr-icon-btn" title="Next result">
            <span class="material-symbols-outlined">keyboard_arrow_down</span>
        </button>
        <span id="searchStatus" class="search-status"></span>
        <label class="search-option"><input type="checkbox" id="searchMatchCase"> Match case</label>
        <label class="search-option"><input type="checkbox" id="searchWholeWord"> Whole word</label>
        <label class="search-option"><input type="checkbox" id="searchMatchDiacritics"> Match diacritics</label>
        <div class="hdr-spacer"></div>
        <button id="closeSearch" class="hdr-icon-btn" title="Close search (Esc)">
            <span class="material-symbols-outlined">close</span>
        </button>
    </footer>

    <dialog id="passwordDialog">
        <form method="dialog" class="password-form">
            <div class="password-title">Password required</div>
            <div id="passwordText" class="password-text"></div>
            <input id="passwordInput" type="password" autocomplete="off" aria-label="Password">
            <div id="passwordError" class="password-error" hidden>Incorrect password. Please try again.</div>
            <div class="password-buttons">
                <button value="cancel" formnovalidate>Cancel</button>
                <button value="open" class="primary">Open</button>
            </div>
        </form>
    </dialog>

    <script type="module" src="demo.js"></script>
</body>
</html>
