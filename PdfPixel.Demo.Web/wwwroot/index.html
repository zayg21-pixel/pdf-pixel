<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Pixel</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: Roboto, Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* ── Toolbar ─────────────────────────────────────────────── */
        #header {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 12px;
            height: 40px;
            background: #f0f0f0;
            color: #1a1a1a;
            border-bottom: 1px solid #c8c8c8;
            z-index: 10;
        }

        .app-brand {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-right: 8px;
            flex-shrink: 0;
            text-decoration: none;
            user-select: none;
        }

        .app-logo {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }

        .app-title {
            margin: 0;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.1px;
            white-space: nowrap;
            color: #1a1a1a;
        }

        .title-accent {
            color: #4695eb;
        }

        /* Pushes the GitHub button to the far right */
        .hdr-spacer {
            flex: 1 1 auto;
        }

        .header-sep {
            width: 1px;
            height: 24px;
            background: rgba(0, 0, 0, 0.15);
            margin: 0 6px;
            flex-shrink: 0;
        }

        /* ── Toolbar icon buttons ────────────────────────────────── */
        .hdr-icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            padding: 0;
            background: none;
            border: none;
            border-radius: 3px;
            color: #3c3c3c;
            cursor: pointer;
            transition: background 0.15s;
            flex-shrink: 0;
        }

        .hdr-icon-btn:hover:not(:disabled) {
            background: rgba(0, 0, 0, 0.07);
        }

        .hdr-icon-btn:active:not(:disabled) {
            background: rgba(0, 0, 0, 0.13);
        }

        .hdr-icon-btn:disabled {
            color: rgba(0, 0, 0, 0.28);
            cursor: default;
        }

        .hdr-icon-btn .material-symbols-outlined {
            font-size: 20px;
            user-select: none;
        }

        /* ── "Open PDF" button ───────────────────────────────────── */
        #loadPdfBtn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            height: 28px;
            padding: 0 10px 0 8px;
            background: #e8e8e8;
            border: 1px solid #c0c0c0;
            border-radius: 3px;
            color: #1a1a1a;
            font-family: Roboto, Arial, sans-serif;
            font-size: 13px;
            font-weight: 400;
            cursor: pointer;
            transition: background 0.15s;
            white-space: nowrap;
            flex-shrink: 0;
        }

        #loadPdfBtn:hover {
            background: #dedede;
        }

        #loadPdfBtn:active {
            background: #d0d0d0;
        }

        #loadPdfBtn .material-symbols-outlined {
            font-size: 17px;
        }

        /* ── Page navigation: [<] [input] / N [>] ─────────────────── */
        .page-nav {
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }

        #pageInput {
            width: 44px;
            height: 24px;
            padding: 0 4px;
            background: #ffffff;
            border: 1px solid #c0c0c0;
            border-radius: 3px;
            color: #1a1a1a;
            font-family: Roboto, Arial, sans-serif;
            font-size: 13px;
            font-weight: 400;
            text-align: center;
            outline: none;
            transition: border-color 0.15s;
            -moz-appearance: textfield;
        }

        #pageInput::-webkit-inner-spin-button,
        #pageInput::-webkit-outer-spin-button {
            -webkit-appearance: none;
        }

        #pageInput:focus {
            border-color: #555555;
        }

        #pageInput:disabled {
            opacity: 0.45;
            cursor: default;
        }

        .page-total {
            font-size: 13px;
            color: rgba(0, 0, 0, 0.55);
            white-space: nowrap;
            padding-left: 4px;
            user-select: none;
        }

        /* ── Zoom controls ────────────────────────────────────────── */
        #zoomLevel {
            min-width: 46px;
            text-align: center;
            font-size: 13px;
            color: rgba(0, 0, 0, 0.65);
            user-select: none;
        }

        /* ── Search footer ───────────────────────────────────────── */
        #footer {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 12px;
            height: 36px;
            background: #f0f0f0;
            color: #1a1a1a;
            border-top: 1px solid #c8c8c8;
            z-index: 10;
        }

        .search-option {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-left: 4px;
            font-size: 13px;
            user-select: none;
        }

        #searchInput {
            width: 240px;
            height: 24px;
            padding: 0 6px;
            background: #ffffff;
            border: 1px solid #c0c0c0;
            border-radius: 3px;
            color: #1a1a1a;
            font-family: Roboto, Arial, sans-serif;
            font-size: 13px;
            outline: none;
            transition: border-color 0.15s;
        }

        #searchInput:focus {
            border-color: #555555;
        }

        .search-status {
            margin-left: 4px;
            font-size: 12px;
            color: rgba(0, 0, 0, 0.55);
            user-select: none;
        }

        /* ── Canvas container ─────────────────────────────────────── */
        #canvasContainer {
            flex: 1 1 auto;
            position: relative;
            overflow: hidden;
        }

        /* ── Annotation popup tooltip ─────────────────────────────── */
        .annotation-popup {
            display: none;
            position: absolute;
            z-index: 10;
            max-width: 320px;
            padding: 8px 12px;
            background: #fff;
            border: 1px solid #c0c0c0;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
            font-size: 13px;
            color: #1a1a1a;
            pointer-events: none;
            line-height: 1.4;
        }

        .annotation-popup.visible {
            display: block;
        }

        .annotation-popup-title {
            font-weight: 600;
            margin-bottom: 2px;
        }

        .annotation-popup-content {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .annotation-popup-date {
            margin-top: 4px;
            font-size: 11px;
            color: rgba(0, 0, 0, 0.45);
        }

        .annotation-popup-replies {
            margin-left: 12px;
        }
    </style>
</head>
<body>
    <header id="header">
        <h1 class="app-title">PDF <span class="title-accent">Pixel</span></h1>
        <div class="header-sep"></div>

        <input type="file" id="pdfFileInput" accept="application/pdf" style="display:none">
        <button id="loadPdfBtn" title="Open a PDF file">
            <span class="material-symbols-outlined">upload_file</span>
            Open PDF
        </button>

        <div class="header-sep"></div>

        <div class="page-nav">
            <button id="prevPage" class="hdr-icon-btn" disabled title="Previous page">
                <span class="material-symbols-outlined">chevron_left</span>
            </button>
            <input id="pageInput" type="number" value="" placeholder="–" disabled min="1" title="Go to page" aria-label="Current page">
            <span id="pageTotal" class="page-total">/ –</span>
            <button id="nextPage" class="hdr-icon-btn" disabled title="Next page">
                <span class="material-symbols-outlined">chevron_right</span>
            </button>
        </div>

        <div class="header-sep"></div>

        <button id="zoomOut" class="hdr-icon-btn" title="Zoom out (Ctrl+scroll)">
            <span class="material-symbols-outlined">zoom_out</span>
        </button>
        <span id="zoomLevel">100%</span>
        <button id="zoomIn" class="hdr-icon-btn" title="Zoom in (Ctrl+scroll)">
            <span class="material-symbols-outlined">zoom_in</span>
        </button>
        <button id="resetZoom" class="hdr-icon-btn" title="Reset zoom">
            <span class="material-symbols-outlined">zoom_in_map</span>
        </button>

        <div class="hdr-spacer"></div>

        <a id="githubBtn" class="hdr-icon-btn" href="https://github.com/zayg21-pixel/pdf-pixel" target="_blank" rel="noopener" title="View on GitHub">
            <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
                    0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
                    -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
                    .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
                    -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0
                    1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82
                    1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01
                    1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z" />
            </svg>
        </a>
    </header>

    <div id="canvasContainer">
        <div id="annotationPopup" class="annotation-popup"></div>
    </div>

    <footer id="footer">
        <input id="searchInput" type="search" placeholder="Search" aria-label="Search">
        <button id="previousSearchResult" class="hdr-icon-btn" title="Previous result">
            <span class="material-symbols-outlined">keyboard_arrow_up</span>
        </button>
        <button id="nextSearchResult" class="hdr-icon-btn" title="Next result">
            <span class="material-symbols-outlined">keyboard_arrow_down</span>
        </button>
        <span id="searchStatus" class="search-status"></span>
        <label class="search-option"><input type="checkbox" id="searchMatchCase"> Match case</label>
        <label class="search-option"><input type="checkbox" id="searchWholeWord"> Whole word</label>
        <label class="search-option"><input type="checkbox" id="searchMatchDiacritics"> Match diacritics</label>
    </footer>

    <script type="module">
        import * as pdfPixel from './index.js';

        await pdfPixel.initialize();

        const container = document.getElementById('canvasContainer');
        const containerId = container.id;

        await pdfPixel.registerPanel(containerId, container, {
            settings: {
                renderer: {
                    backgroundColor: '#D3D3D3',
                    showPageLoadingAnimation: false
                }
            }
        });

        const loadPdfBtn = document.getElementById('loadPdfBtn');
        const pdfFileInput = document.getElementById('pdfFileInput');
        const prevPageButton = document.getElementById('prevPage');
        const nextPageButton = document.getElementById('nextPage');
        const pageInput = document.getElementById('pageInput');
        const pageTotalLabel = document.getElementById('pageTotal');
        const zoomLevelLabel = document.getElementById('zoomLevel');
        const zoomOutButton = document.getElementById('zoomOut');
        const zoomInButton = document.getElementById('zoomIn');
        const resetZoomButton = document.getElementById('resetZoom');
        const annotationPopupEl = document.getElementById('annotationPopup');
        const searchInput = document.getElementById('searchInput');
        const searchStatus = document.getElementById('searchStatus');
        const previousSearchResultButton = document.getElementById('previousSearchResult');
        const nextSearchResultButton = document.getElementById('nextSearchResult');
        const searchMatchCaseInput = document.getElementById('searchMatchCase');
        const searchWholeWordInput = document.getElementById('searchWholeWord');
        const searchMatchDiacriticsInput = document.getElementById('searchMatchDiacritics');

        let currentState = { currentPage: 0, pageCount: 0, scale: 1.0 };
        let searchInputTimer = null;

        function updateSearchStatus(state) {
            const results = state.searchResults;
            const current = state.currentSearchResult;
            const currentIndex = current
                ? results.findIndex(result => result.pageNumber === current.pageNumber
                    && result.startIndex === current.startIndex
                    && result.length === current.length)
                : -1;

            if (searchInput.value.length === 0) {
                searchStatus.textContent = '';
            } else if (!state.isTextExtracted) {
                searchStatus.textContent = 'Searching...';
            } else if (results.length === 0) {
                searchStatus.textContent = 'Not found';
            } else if (currentIndex >= 0) {
                searchStatus.textContent = `${currentIndex + 1} of ${results.length}`;
            } else {
                searchStatus.textContent = `${results.length} found`;
            }
        }

        searchInput.addEventListener('input', () => {
            clearTimeout(searchInputTimer);
            searchInputTimer = setTimeout(() => {
                pdfPixel.updateConfiguration(containerId, { settings: { text: { extractText: searchInput.value.length > 0 } } });
                pdfPixel.setCurrentSearchResult(containerId, null);
                pdfPixel.setSearchQuery(containerId, searchInput.value);
            }, 300);
        });

        previousSearchResultButton.addEventListener('click', () => pdfPixel.previousSearchResult(containerId));
        nextSearchResultButton.addEventListener('click', () => pdfPixel.nextSearchResult(containerId));

        searchMatchCaseInput.addEventListener('change', () =>
            pdfPixel.updateConfiguration(containerId, { settings: { search: { matchCase: searchMatchCaseInput.checked } } }));
        searchWholeWordInput.addEventListener('change', () =>
            pdfPixel.updateConfiguration(containerId, { settings: { search: { wholeWord: searchWholeWordInput.checked } } }));
        searchMatchDiacriticsInput.addEventListener('change', () =>
            pdfPixel.updateConfiguration(containerId, { settings: { search: { matchDiacritics: searchMatchDiacriticsInput.checked } } }));

        function updateAnnotationPopup(state) {
            const popup = state.annotationPopup;
            const hasMessages = popup && popup.messages && popup.messages.length > 0;

            if (!hasMessages || state.mouseX == null || state.mouseY == null) {
                annotationPopupEl.classList.remove('visible');
                return;
            }

            annotationPopupEl.innerHTML = renderAnnotationMessages(popup.messages);

            // Position below and to the right of the cursor
            const containerRect = container.getBoundingClientRect();
            const offsetX = 12;
            const offsetY = 16;
            let left = state.mouseX + offsetX;
            let top = state.mouseY + offsetY;

            // Clamp so popup stays within the container
            const maxLeft = containerRect.width - annotationPopupEl.offsetWidth - 4;
            const maxTop = containerRect.height - annotationPopupEl.offsetHeight - 4;
            if (left > maxLeft) {
                left = state.mouseX - annotationPopupEl.offsetWidth - offsetX;
            }
            if (top > maxTop) {
                top = state.mouseY - annotationPopupEl.offsetHeight - offsetY;
            }

            annotationPopupEl.style.left = Math.max(0, left) + 'px';
            annotationPopupEl.style.top = Math.max(0, top) + 'px';
            annotationPopupEl.classList.add('visible');
        }

        function renderAnnotationMessages(messages) {
            let html = '';
            for (const message of messages) {
                if (message.title) {
                    html += `<div class="annotation-popup-title">${escapeHtml(message.title)}</div>`;
                }
                if (message.contents) {
                    html += `<div class="annotation-popup-content">${escapeHtml(message.contents)}</div>`;
                }
                if (message.creationDate) {
                    const dateText = new Date(message.creationDate).toLocaleString();
                    html += `<div class="annotation-popup-date">${dateText}</div>`;
                }
                if (message.replies.length > 0) {
                    html += `<div class="annotation-popup-replies">${renderAnnotationMessages(message.replies)}</div>`;
                }
            }
            return html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        pdfPixel.setOnStateChanged(containerId, (state) => {
            currentState = state;
            const hasDocument = state.pageCount > 0;
            pageInput.disabled = !hasDocument;
            if (document.activeElement !== pageInput) {
                pageInput.value = hasDocument ? String(state.currentPage) : '';
                pageInput.max = hasDocument ? String(state.pageCount) : '';
            }
            pageTotalLabel.textContent = hasDocument ? `/ ${state.pageCount}` : '/ –';
            prevPageButton.disabled = !hasDocument || state.currentPage <= 1;
            nextPageButton.disabled = !hasDocument || state.currentPage >= state.pageCount;
            zoomLevelLabel.textContent = `${Math.round(state.scale * 100)}%`;

            updateAnnotationPopup(state);
            updateSearchStatus(state);
        });

        pdfPixel.setOnFramePresented(containerId, ({ canvas, frame }) => {
            const context = canvas.getContext('2d');
            const { width, height } = frame.panelSize;

            context.clearRect(0, 0, width, height);
            drawLogo(context, width, height);
        });

        function drawLogo(context, panelWidth, panelHeight) {
            const cellSize = 18;
            const padding = 4;

            context.save();
            context.translate(panelWidth - 58, panelHeight - 48);
            context.scale(0.5, 0.5);

            for (let column = 0; column < 3; column++) {
                for (let row = 0; row < 3; row++) {
                    const isCenter = column === 1 && row === 1;
                    context.fillStyle = isCenter ? 'rgba(70, 149, 235, 0.5)' : 'rgba(33, 35, 43, 0.5)';
                    context.fillRect(column * (cellSize + padding), row * (cellSize + padding), cellSize, cellSize);
                }
            }

            context.restore();
        }

        prevPageButton.addEventListener('click', () => {
            if (currentState.currentPage > 1) {
                pdfPixel.setPage(containerId, currentState.currentPage - 1);
            }
        });

        nextPageButton.addEventListener('click', () => {
            if (currentState.currentPage < currentState.pageCount) {
                pdfPixel.setPage(containerId, currentState.currentPage + 1);
            }
        });

        pageInput.addEventListener('change', () => {
            const requestedPage = parseInt(pageInput.value, 10);
            if (!isNaN(requestedPage) && requestedPage >= 1 && requestedPage <= currentState.pageCount) {
                pdfPixel.setPage(containerId, requestedPage);
            } else {
                pageInput.value = String(currentState.currentPage);
            }
        });

        pageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                pageInput.blur();
            }
        });

        zoomOutButton.addEventListener('click', () => {
            pdfPixel.setScale(containerId, currentState.scale * 0.9);
        });

        zoomInButton.addEventListener('click', () => {
            pdfPixel.setScale(containerId, currentState.scale * 1.1);
        });

        resetZoomButton.addEventListener('click', () => {
            pdfPixel.setScale(containerId, 1.0);
        });

        loadPdfBtn.addEventListener('click', () => {
            pdfFileInput.value = '';
            pdfFileInput.click();
        });

        pdfFileInput.addEventListener('change', async (event) => {
            const file = event.target.files && event.target.files[0];
            if (!file) {
                return;
            }
            const arrayBuffer = await file.arrayBuffer();
            await pdfPixel.setDocument(containerId, new Uint8Array(arrayBuffer));
            pdfPixel.requestRedraw(containerId);
        });
    </script>
</body>
</html>
